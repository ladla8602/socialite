directive @upper on FIELD_DEFINITION

input CreatePostInput {
  content: String!
  content_type: Float!
  hashTags: String
}

input CreateUserInput {
  device_token: String
  device_type: Int!
  full_name: String!
  identity: String!
  latitude: Float
  longitude: Float
  password: String!
  username: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

input LoginInput {
  device_token: String
  device_type: String
  identity: String!
  password: String!
}

type LoginResponse {
  access_token: String!
  refresh_token: String!
}

type Mutation {
  createPost(createPostInput: CreatePostInput!): PostEntity!
  createUser(createUserInput: CreateUserInput!): UserEntity!
  login(loginInput: LoginInput!): LoginResponse!
  refreshToken(refreshToken: String!): LoginResponse!
}

type PostCommentEntity {
  created_at: DateTime!
  id: ID!
}

type PostEntity {
  comments: [PostCommentEntity!]
  content: String!
  content_type: Int!
  created_at: DateTime!
  deleted_at: DateTime
  desc: String
  id: ID!
  likes: [PostLikeEntity!]
  postImages: [PostImageEntity!]
  postVideo: PostVideoEntity
  tags: [TagEntity!]
  thumbnail: String
  updated_at: DateTime!
  user: UserEntity!
}

type PostImageEntity {
  created_at: DateTime!
  id: ID!
  image_url: String!
}

type PostLikeEntity {
  created_at: DateTime!
  id: ID!
  isLike: Boolean!
}

type PostTagEntity {
  post: PostEntity!
  postId: String!
  tag: TagEntity!
  tagId: String!
}

type PostVideoEntity {
  id: ID!
  media_url: String!
}

type Query {
  getPosts: [PostEntity!]!
  hello: String!
  users: [UserEntity!]!
}

type TagEntity {
  id: ID!
  name: String!
  postTags: [PostTagEntity!]
}

type UserEntity {
  background_image: String
  bio: String
  block_user_ids: [String!]
  comments: [PostCommentEntity!]!
  created_at: DateTime!
  deleted_at: DateTime
  device_token: String
  device_type: Int!
  followers: Int
  following: Int
  full_name: String
  id: ID!
  identity: String!
  is_active: Boolean!
  is_block: Boolean!
  is_invited_to_room: Int!
  is_push_notifications: Int!
  is_verified: Int!
  latitude: Float
  likes: [PostLikeEntity!]!
  login_type: Int
  longitude: Float
  posts: [PostEntity!]!
  profile: String
  updated_at: DateTime!
  username: String!
}