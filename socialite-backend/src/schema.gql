directive @upper on FIELD_DEFINITION

input CheckEmailInput {
  email: String!
}

input CheckUsernameInput {
  username: String!
}

input CreateCommentInput {
  content: String!
  postId: String!
}

input CreatePostInput {
  content: String!
  content_type: Int!
  hashTags: String
}

input CreateUserInput {
  device_token: String
  device_type: Int!
  full_name: String!
  google_id: String
  identity: String!
  latitude: Float
  longitude: Float
  password: String!
  username: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

input LoginInput {
  device_token: String
  device_type: Float
  identity: String!
  password: String!
}

type LoginResponse {
  access_token: String!
  refresh_token: String!
  user: UserEntity
}

type Mutation {
  addPostComment(addPostComment: CreateCommentInput!): PostCommentEntity!
  createPost(createPostInput: CreatePostInput!): PostEntity!
  createUser(createUserInput: CreateUserInput!): LoginResponse!
  follow(followingId: String!): UserFollowEntity!
  googleLogin(googleToken: String!): LoginResponse
  login(loginInput: LoginInput!): LoginResponse!
  refreshToken(refreshToken: String!): LoginResponse!
  unfollow(followingId: String!): String!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type PaginatedPost {
  edges: [PostEntity!]!
  pageInfo: PageInfo!
}

type PaginatedUser {
  edges: [UserEntity!]!
  pageInfo: PageInfo!
}

type PostCommentEntity {
  content: String!
  created_at: DateTime!
  id: ID!
}

type PostEntity {
  commentsCount: Int!
  content: String!
  content_type: Int!
  created_at: DateTime!
  deleted_at: DateTime
  id: ID!
  is_active: Boolean!
  likes: [PostLikeEntity!]
  postImages: [PostImageEntity!]
  postVideo: PostVideoEntity
  tags: [TagEntity!]
  thumbnail: String
  updated_at: DateTime!
  user: UserEntity!
}

type PostImageEntity {
  created_at: DateTime!
  fullImageUrl: String!
  id: ID!
  image_url: String!
  is_active: Boolean!
}

type PostLikeEntity {
  created_at: DateTime!
  id: ID!
}

type PostTagEntity {
  post: PostEntity!
  postId: String!
  tag: TagEntity!
  tagId: String!
}

type PostVideoEntity {
  id: ID!
  media_url: String!
}

type Query {
  checkEmailExists(checkEmailInput: CheckEmailInput!): Boolean!
  checkUsernameExists(checkUsernameInput: CheckUsernameInput!): Boolean!
  followed(after: String, first: Int! = 10): PaginatedUser!
  getUserPosts(after: String, first: Int! = 10): PaginatedPost!
  hello: String!
  profile: UserEntity!
  suggestUsername(suggestUsernameInput: SuggestUsernameInput!): String!
}

input SuggestUsernameInput {
  email: String!
  name: String!
}

type TagEntity {
  id: ID!
  name: String!
  postTags: [PostTagEntity!]
}

type UserEntity {
  background_image: String
  bio: String
  block_user_ids: [String!]
  comments: [PostCommentEntity!]
  created_at: DateTime!
  deleted_at: DateTime
  device_token: String
  device_type: Int!
  followedCount: Int!
  followerCount: Int!
  followers_users: [UserFollowEntity!]
  following_users: [UserFollowEntity!]
  full_name: String
  google_id: String
  id: ID!
  identity: String!
  is_active: Boolean!
  is_block: Boolean!
  is_invited_to_room: Int!
  is_push_notifications: Int!
  is_verified: Int!
  latitude: Float
  likes: [PostLikeEntity!]
  login_type: Int
  longitude: Float
  posts: [PostEntity!]
  profile: String
  updated_at: DateTime!
  username: String!
}

type UserFollowEntity {
  created_at: DateTime!
  followed: UserEntity!
  follower: UserEntity!
  id: ID!
}